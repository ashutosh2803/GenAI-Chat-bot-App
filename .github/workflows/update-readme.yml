# After a pull request is merged into master, refresh readme.md from that
# change and replace docs/screenshot.png with a new chat screenshot.
#
# Direct pushes to master are ignored. The commit this workflow pushes uses
# the default GITHUB_TOKEN, which does not start another run.
#
# Required repository secret:
#   README_AI_API_KEY  OpenAI-compatible API key used to rewrite the README
# Optional repository variables:
#   README_AI_BASE_URL  default https://api.openai.com/v1
#   README_AI_MODEL     default gpt-4.1-mini
#
# master must allow this token to push. If master requires a pull request, add
# a bypass for GitHub Actions or this commit step will fail.

name: Update README and screenshot

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Find the merged pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            let pr;

            if (context.eventName === 'workflow_dispatch') {
              const { data } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'closed',
                base: 'master',
                sort: 'updated',
                direction: 'desc',
                per_page: 20,
              });
              pr = data.find((item) => item.merged_at);
            } else {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: context.sha,
              });
              pr = data.find((item) => item.merged_at && item.base.ref === 'master');
            }

            if (!pr) {
              core.setOutput('should_run', 'false');
              core.notice('This push is not a merged pull request. Skipping README update.');
              return;
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const names = files.map((file) => file.filename);
            const generated = new Set(['readme.md', 'docs/screenshot.png']);
            if (names.length > 0 && names.every((name) => generated.has(name))) {
              core.setOutput('should_run', 'false');
              core.notice('This pull request only updated the generated README or screenshot. Skipping.');
              return;
            }

            fs.writeFileSync('pr-meta.json', JSON.stringify({
              number: pr.number,
              title: pr.title,
              body: pr.body || '',
              files: names,
            }));
            core.setOutput('should_run', 'true');
            core.setOutput('number', String(pr.number));

      - name: Require the README model secret
        if: steps.pr.outputs.should_run == 'true'
        env:
          README_AI_API_KEY: ${{ secrets.README_AI_API_KEY }}
        run: |
          if [ -z "$README_AI_API_KEY" ]; then
            echo "Add repository secret README_AI_API_KEY before this workflow can rewrite the README."
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.pr.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.should_run == 'true'
        with:
          node-version: "22"

      - name: Save the pull request diff
        if: steps.pr.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr diff "$PR_NUMBER" > pr.diff

      - name: Start the app and capture a screenshot
        if: steps.pr.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt
          (
            cd backend
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
          ) > backend.log 2>&1 &
          (
            cd frontend
            npm ci
            npm run dev -- --host 127.0.0.1 --port 5173 --strictPort
          ) > frontend.log 2>&1 &

          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health || { echo "Backend failed to start"; cat backend.log; exit 1; }

          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:5173 >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5173 >/dev/null || { echo "Frontend failed to start"; cat frontend.log; exit 1; }

          cd .github/scripts
          npm ci
          npx playwright install --with-deps chromium
          node capture-screenshot.mjs

      - name: Rewrite the README from the merged changes
        if: steps.pr.outputs.should_run == 'true'
        env:
          README_AI_API_KEY: ${{ secrets.README_AI_API_KEY }}
          README_AI_BASE_URL: ${{ vars.README_AI_BASE_URL }}
          README_AI_MODEL: ${{ vars.README_AI_MODEL }}
        run: node .github/scripts/update-readme.mjs

      - name: Commit the README and screenshot
        if: steps.pr.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.md docs/screenshot.png
          if git diff --cached --quiet; then
            echo "README and screenshot already match this merge."
            exit 0
          fi
          git commit -m "Update README and screenshot after merged changes"
          git push origin HEAD:master
